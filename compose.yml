name: meno

services:
  # ---------------------------------------------------------------
  # PostgreSQL — banco de dados do Tandoor
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: meno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - meno
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # Tandoor Recipes — receitas e planejamento de refeições
  # A imagem já traz nginx embutido e expõe a porta 80 do container.
  # ---------------------------------------------------------------
  tandoor:
    image: vabene1111/recipes:latest
    container_name: meno-tandoor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET_KEY: ${TANDOOR_SECRET_KEY}
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_HOSTS: ${TANDOOR_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${TANDOOR_CSRF_TRUSTED_ORIGINS}
      TIMEZONE: ${TZ}
      DEBUG: "0"
    ports:
      - "${TANDOOR_HTTP_PORT}:80"
    volumes:
      - tandoor_static:/opt/recipes/staticfiles
      - ./apps/tandoor/media:/opt/recipes/mediafiles
    networks:
      - meno

  # ---------------------------------------------------------------
  # Grocy — despensa, estoque, compras e organização doméstica
  # Usa SQLite (armazenamento padrão do projeto), dentro de /config.
  # ---------------------------------------------------------------
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: meno-grocy
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    ports:
      - "${GROCY_HTTP_PORT}:80"
    volumes:
      - ./apps/grocy/data:/config
    networks:
      - meno

networks:
  meno:
    driver: bridge

volumes:
  tandoor_static:
