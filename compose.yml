name: meno

x-wger-env: &wger-env
  SECRET_KEY: ${WGER_SECRET_KEY}
  SITE_URL: ${WGER_SITE_URL}
  CSRF_TRUSTED_ORIGINS: ${WGER_CSRF_TRUSTED_ORIGINS}
  DJANGO_DB_ENGINE: django.db.backends.postgresql
  DJANGO_DB_DATABASE: ${WGER_POSTGRES_DB}
  DJANGO_DB_USER: ${POSTGRES_USER}
  DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD}
  DJANGO_DB_HOST: postgres
  DJANGO_DB_PORT: "5432"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${WGER_POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  TIMEZONE: ${TZ}
  REDIS_HOST: wger_cache
  REDIS_PORT: "6379"
  REDIS_DB: "1"
  CELERY_BROKER_URL: redis://wger_cache:6379/2
  CELERY_RESULT_BACKEND: redis://wger_cache:6379/2
  DJANGO_COLLECTSTATIC_ON_STARTUP: "true"

services:
  postgres:
    image: postgres:16-alpine
    container_name: meno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WGER_POSTGRES_DB: ${WGER_POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - meno
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tandoor:
    image: vabene1111/recipes:latest
    container_name: meno-tandoor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET_KEY: ${TANDOOR_SECRET_KEY}
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_HOSTS: ${TANDOOR_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${TANDOOR_CSRF_TRUSTED_ORIGINS}
      TIMEZONE: ${TZ}
      DEBUG: "0"
    ports:
      - "${TANDOOR_HTTP_PORT}:80"
    volumes:
      - tandoor_static:/opt/recipes/staticfiles
      - ./apps/tandoor/media:/opt/recipes/mediafiles
    networks:
      - meno

  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: meno-grocy
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    ports:
      - "${GROCY_HTTP_PORT}:80"
    volumes:
      - ./apps/grocy/data:/config
    networks:
      - meno

  wger_cache:
    image: redis:7-alpine
    container_name: meno-wger-cache
    restart: unless-stopped
    volumes:
      - wger_redis_data:/data
    networks:
      - meno

  wger:
    image: wger/server:latest
    container_name: meno-wger
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      wger_cache:
        condition: service_started
    environment:
      <<: *wger-env
    expose:
      - "8000"
    volumes:
      - ./apps/wger/static:/home/wger/static
      - ./apps/wger/media:/home/wger/media
    networks:
      - meno

  wger_nginx:
    image: nginx:alpine
    container_name: meno-wger-nginx
    restart: unless-stopped
    depends_on:
      - wger
    volumes:
      - ./apps/wger/static:/wger/static:ro
      - ./apps/wger/media:/wger/media:ro
      - ./apps/wger/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WGER_HTTP_PORT}:80"
    networks:
      - meno

  wger_celery_worker:
    image: wger/server:latest
    container_name: meno-wger-celery-worker
    restart: unless-stopped
    command: celery -A wger worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      wger_cache:
        condition: service_started
    environment:
      <<: *wger-env
    volumes:
      - ./apps/wger/media:/home/wger/media
    networks:
      - meno

networks:
  meno:
    driver: bridge

volumes:
  tandoor_static:
  wger_redis_data: